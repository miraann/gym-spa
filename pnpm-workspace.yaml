packages:
  - apps/*
  - packages/*
  - supabase
allowBuilds:
  # Its install script only copies the binary; its launcher does the same on first run.
  deno: false
  electron-winstaller: false
  esbuild: true
  # Downloads the Supabase CLI binary.
  supabase: true
  # The ACR122U (PC/SC) reader in the Windows app (step 2f): compiles its native part with node-gyp.
  smartcard: true
