<!doctype html>
<html lang="ckb" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f15" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>%APP_NAME%</title>
    <script>
      // Applies the saved language, theme, text size and gym look before the first paint (no flash
      // of the wrong direction or colors). Keep in sync with src/lib/preferences.ts,
      // src/lib/document.ts and src/lib/appearance.ts.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('gym.preferences') || '{}');
          var language =
            saved.language === 'en' || saved.language === 'ar' ? saved.language : 'ckb';
          var root = document.documentElement;
          root.lang = language;
          root.dir = language === 'en' ? 'ltr' : 'rtl';
          var dark =
            saved.theme === 'dark' ||
            (saved.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.classList.toggle('dark', dark);
          if (saved.textSize === 'large') root.style.fontSize = '112.5%';
          // The gym's look (src/lib/appearance.ts caches its CSS variables).
          var look = JSON.parse(localStorage.getItem('gym.look') || '{}');
          var variables = look.variables || {};
          for (var name in variables) {
            if (/^--(brand-[a-z-]+|radius)$/.test(name) && typeof variables[name] === 'string') {
              root.style.setProperty(name, variables[name]);
            }
          }
          var bar = dark ? '#0e0f15' : '#f5f5fa';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var index = 0; index < metas.length; index += 1) {
            metas[index].setAttribute('content', bar);
          }
        } catch (error) {
          // Storage blocked: keep the Kurdish defaults from the <html> tag.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
